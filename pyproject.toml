[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "disciples-play"
version = "0.1.0.dev0"
description = "Portability and comfort wrapper for Disciples: Sacred Lands Gold (1999) - your own game files, never game data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Szymon" }]
keywords = ["disciples", "sacred-lands", "wine", "cnc-ddraw", "retrogaming", "wrapper"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Real Time Strategy",
]
# No runtime dependencies, by design: the launcher must run from a bare
# CPython on any distro without a network round-trip.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
disciples-play = "disciples_play.__main__:main"

[project.urls]
Homepage = "https://github.com/szymon-sicinski/disciples-playability"
Plan = "https://github.com/szymon-sicinski/disciples-playability/blob/main/docs/plans/00-playability-plan.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "realgame: tests that run against a real install (DISCIPLES_GAME_DIR)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
